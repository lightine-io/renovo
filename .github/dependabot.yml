# Dependabot configuration for Renovo.
#
# Schedules version updates for Gradle dependencies and GitHub Actions. Security updates are
# enabled separately in the repository settings (Code security and analysis > Dependabot security
# updates) and use this file's `package-ecosystem` entries for routing.
#
# See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Gradle and Kotlin dependencies (build.gradle.kts and libs.versions.toml)
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - gradle
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions workflow versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      # Actions bumps are CI-only and never reach a host app, so this label satisfies the
      # changelog gate (.github/workflows/changelog.yml) up front. Gradle bumps above do NOT get
      # it: they can change the shipped library, so the changelog decision stays per pull request.
      - no-changelog
    # One grouped pull request per cycle instead of one per action. Under strict branch
    # protection, N separate pull requests cost N sequential CI cycles, because each merge puts
    # the rest behind main.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
