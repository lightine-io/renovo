# Dependabot configuration for Renovo.
#
# Schedules version updates for Gradle dependencies and GitHub Actions. Security updates are
# turned on separately in the repository settings (Code security and analysis > Dependabot security
# updates). They use the `package-ecosystem` entries in this file to know where each dependency lives.
#
# See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Gradle and Kotlin dependencies (build.gradle.kts and libs.versions.toml)
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - gradle
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions workflow versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      # An Actions update changes only CI and never reaches a host app, so this label passes the
      # changelog check (.github/workflows/changelog.yml) right away. Gradle updates above do NOT
      # get it: they can change the shipped library, so each of those pull requests decides itself.
      - no-changelog
    # One pull request per month for all actions, instead of one per action. Branch protection
    # requires every pull request to be up to date with main before it merges. So each merge puts
    # the other pull requests behind main, and N separate pull requests cost N CI runs, one after
    # another.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
