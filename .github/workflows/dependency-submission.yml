# Sends GitHub's Dependency Graph the full list of Gradle dependencies, including the dependencies
# of dependencies. GitHub cannot work out that full list for a Gradle project on its own, so
# without this step Dependabot alerts see only the dependencies the build files name directly.
# With it, the whole tree is checked for known vulnerabilities (CVEs).
#
# Runs on push to main only. GitHub takes longer than ten minutes to show a pull request's
# dependencies to the review API, so a review on each pull request compared nothing. Dependabot
# catches vulnerabilities after a merge, and the review before each release catches them before
# they ship (see SECURITY.md).

name: dependency submission

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-submission:
    name: dependency graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 21 to match check.yml; the Gradle daemon itself runs on JDK 17
      # (gradle/gradle-daemon-jvm.properties, provisioned by the foojay resolver).
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Resolving the graph configures the Android modules, which read compileSdk 37. Ensure the
      # platform explicitly (with license acceptance) instead of relying on AGP's auto-download,
      # which could hang on an unaccepted-license prompt in CI. Same approach as check.yml.
      - name: Ensure Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-37.0"
          fi

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Check only what ships. Test-only dependencies, for example Robolectric and everything
          # it pulls in, stay out of the submitted list, so Dependabot never raises alerts for code
          # that cannot reach a host app. The pattern matches the test classpath of each build
          # variant, which are project configurations. The classpath of the Gradle plugins is not
          # a project configuration and is not submitted at all.
          dependency-graph-exclude-configurations: '.*[Tt]est(Compile|Runtime)Classpath'
