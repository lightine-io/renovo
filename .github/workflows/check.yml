# Continuous integration: builds and tests Renovo on every pull request, on every push to main,
# and once a week. The branch protection rule "Require status checks to pass before merging"
# waits for these jobs. The job names below are the names of those required checks, so renaming a
# job here means updating the branch protection rule too.
#
# Scope:
# - One Linux runner is enough: the library is Android-only and needs no emulator. Unit tests run
#   on the JVM, with Robolectric where Android classes are needed. Tests that need a device run
#   on a developer's machine.
# - JDK 21 matches each module's jvmToolchain(21). The Gradle daemon itself runs on JDK 17
#   (gradle/gradle-daemon-jvm.properties). The foojay resolver downloads that JDK when needed.
# - Gradle comes from the project's wrapper.
# - Every action is pinned to a full commit SHA with a `# vX.Y.Z` version comment after it. This
#   is for safety: a tag such as `@v6` can be moved to other code, a commit SHA cannot. Dependabot's
#   GitHub Actions updates change both the SHA and the comment. Pin new actions the same way.

name: check

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run (Monday 06:00 UTC). It catches things that break while no pull request runs, such
  # as a removed action, a broken SDK download, or a stale cache. workflow_dispatch allows a run
  # by hand.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  android:
    name: build & test · Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest ships the Android SDK (ANDROID_SDK_ROOT is set) with recent platforms
      # preinstalled, including the compileSdk used here. Its directory and sdkmanager package id
      # are `android-37.0`: the `.0` is Android's finalized minor-version scheme, not a preview
      # marker. So this step is normally a no-op. The guarded install is a fallback for a runner
      # image that lacks the platform. Using the preinstalled sdkmanager keeps CI on first-party
      # actions only. AGP resolves the build tools itself.
      - name: Ensure Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "--- platforms present ---"; ls -1 "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || echo "(none)"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            # `yes` feeds the license prompts; its broken pipe when the reader exits is harmless, hence 2>/dev/null.
            yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-37.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Read-only cache for pull request runs; main runs may write fresh entries.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `build` does not run spotlessCheck, so it runs first and fails fast on formatting.
      - name: Check formatting
        run: ./gradlew spotlessCheck

      # `build` runs assemble and `check`: unit tests, lint, and apiCheck (the public API against
      # the committed api/ baselines) for every module.
      - name: Build, run unit tests, lint, and check the public API
        run: ./gradlew build

  # Release guard. Only a real publish builds the publish tasks and the POM, sources, and javadoc
  # jars, and nothing else runs them before a tag. The release dry run only plans the tasks. So a
  # broken artifact, for example a failing Dokka run, would show up in the middle of a release,
  # after the release was approved. This job runs a real local publish on every pull request and
  # every push to main. It needs no secrets: publishToMavenLocal talks to no remote repository, and
  # -Prenovo.skipSigning=true (defined in the root build.gradle.kts) skips PGP signing, which a
  # runner without a key cannot do.
  publish-smoke:
    name: publish · smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Same guarded install as in the job above: the publish builds the release variant, which
      # compiles against android-37.0.
      - name: Ensure Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "--- platforms present ---"; ls -1 "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || echo "(none)"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-37.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Publish all modules to the local Maven repository (unsigned)
        run: ./gradlew publishToMavenLocal -Prenovo.skipSigning=true
