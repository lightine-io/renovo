# Blocks a pull request that introduces a dependency with a known vulnerability (CVE) at or
# above the severity threshold, and shows license information in the pull request. This is the
# pull request gate half of the dependency scan. The continuous full-graph alerting half is
# Dependabot, fed by dependency-submission.yml.
#
# GitHub cannot resolve a Gradle project's graph natively, so the graph must be submitted for the
# review to compare. This job waits for dependency-submission to finish via
# retry-on-snapshot-warnings (up to 600 seconds). On the very first pull request, main has no
# submitted baseline graph yet, so the comparison is trivial. Once that is merged, every push to
# main submits the baseline and later pull requests are compared properly.
#
# License gating (allow-licenses) is intentionally not set yet: an incomplete allow-list would
# fail legitimate Apache-2.0 or MIT dependencies. Licenses are shown in the pull request summary.
# A curated allow-list can tighten this once the transitive license set is known.
#
# First-party (GitHub) action only, consistent with check.yml.

name: dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # for comment-summary-in-pr: on-failure

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        # Pinned to a commit SHA with a version comment (supply-chain hardening). Dependabot's
        # github-actions updates bump both. The action publishes no moving major tag such as `v5`,
        # only point releases like v5.0.0.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Gate on moderate-or-higher CVEs. Low severity is mostly unfixable transitive noise.
          fail-on-severity: moderate
          # Wait for dependency-submission.yml to submit the pull request's Gradle graph.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
          # Comment the summary only when the gate fails, to keep clean pull requests quiet.
          comment-summary-in-pr: on-failure
