# Release pipeline: builds and publishes Renovo on a version tag.
#
# Triggers:
#   - push of a `v*` tag -> the real release (publishes).
#   - workflow_dispatch  -> a dry run. It plans the publish tasks, needs no secrets, and publishes
#                           nothing. Use it to check the pipeline before a real tag.
#
# One Linux runner does everything: the library is Android-only, so nothing needs macOS.
#
# Channel: Maven Central, STAGED (automaticRelease = false in the root build.gradle.kts). The
# workflow uploads a staged deployment, and a maintainer clicks "Publish" in the Central Portal to
# make it final. Published coordinates can never be changed, so staging gives a chance to drop a
# wrong upload and redo it.
#
# Every action is pinned to a full commit SHA with a version comment, for safety, as in
# .github/workflows/check.yml.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve the publish tasks only; publishes nothing, needs no secrets"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Real release - only on a `v*` tag. Runs in the protected `release` environment. A required
  # reviewer must approve the run by hand, and only then does the job get the signing and Central
  # Portal secrets. The environment and the secrets are set up in the repository settings before
  # the first real tag.
  release:
    name: release · publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Both modules compile against android-37.0. The step is normally a no-op: ubuntu-latest
      # ships the platform. See check.yml for the full reasoning.
      - name: Ensure Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-37.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The artifact version comes from `version` in gradle.properties, not from the tag. A tag
      # that disagrees would upload one version and announce another, and published coordinates
      # cannot be changed. So stop before the upload.
      - name: Check that the tag matches the project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(sed -n 's/^version=//p' gradle.properties)
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$PROJECT_VERSION in gradle.properties."
            exit 1
          fi

      - name: Publish to Maven Central (staged)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Notes for people who use the library: the install snippet and this version's
          # CHANGELOG section. The changelog rule guarantees the section exists at tag time.
          {
            echo "## Renovo $TAG"
            echo
            echo "### Install"
            echo
            echo '**Gradle (Kotlin DSL):**'
            echo '```kotlin'
            echo "implementation(\"io.lightine.renovo:renovo-core:$VERSION\")  // update engine, no screens"
            echo "implementation(\"io.lightine.renovo:renovo-ui:$VERSION\")    // optional ready-made screens"
            echo '```'
            echo
            echo "### What's in this release"
            echo
            # index(...) == 1 anchors the match to the exact heading prefix, so tag 0.2.1 can
            # never match a future "## [0.2.10]" heading by substring.
            awk -v ver="## [$VERSION] " '
              /^## \[/ { inblock = index($0, ver) == 1; next }
              inblock  { print }
            ' CHANGELOG.md
          } > release-notes.md
          # Re-run safe: create the release if it does not exist yet; otherwise refresh its notes,
          # so a re-run after a partial failure does not stop on an existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi

  # Dry run - started by hand only. Checks the pipeline WITHOUT publishing: no environment, no
  # secrets, no release. It proves that Gradle can plan the publish tasks.
  dry-run:
    name: release · dry-run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-37.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Validate the publish task graph (no upload, no secrets)
        run: ./gradlew publishToMavenCentral --dry-run
