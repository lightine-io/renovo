[versions]
# The Android Gradle Plugin, Gradle, and Kotlin are the latest stable releases. Kotlin's
# compatibility page lists lower maximum versions than these. The build passes with them, and
# that is what counts.
kotlin = "2.4.21"
agp = "9.4.1"
spotless = "8.10.4"
ktlint = "1.8.0"
dokka = "2.2.0"
maven-publish = "0.37.0"
binary-compatibility-validator = "0.18.2"

# renovo-core runtime dependencies. Nothing else may be added at runtime.
androidx-work = "2.12.0"
kotlinx-coroutines = "1.11.0"
androidx-core = "1.19.1"

# renovo-ui. Compose artifacts are pinned one by one instead of through the Compose BOM. The POM
# of the published library then names the exact versions it was built and tested with, and
# `androidx-compose` is the one place that updates the whole group.
androidx-compose = "1.12.1"
androidx-compose-material3 = "1.4.0"
androidx-compose-material3-adaptive = "1.3.0"
androidx-window = "1.5.1"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
androidx-savedstate = "1.5.0"

# Tests
junit = "4.13.2"
robolectric = "4.17"
androidx-test-core = "1.7.0"
androidx-test-espresso = "3.7.0"
# Screenshot tests of renovo-ui. The plugin has to match the AGP version.
roborazzi = "1.76.0"

[libraries]
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidx-work" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }

androidx-compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "androidx-compose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidx-compose" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-compose-material3" }
androidx-compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "androidx-compose-material3-adaptive" }
androidx-window = { module = "androidx.window:window", version.ref = "androidx-window" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-savedstate = { module = "androidx.savedstate:savedstate", version.ref = "androidx-savedstate" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
# Compose UI test 1.12 pulls Espresso 3.5.1, which calls InputManager.getInstance() through reflection;
# Android 37 removed it. 3.7.0 is the first stable release that works with SDK 37 (checked by running).
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "androidx-compose" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "androidx-compose" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }

[plugins]
# AGP 9 has built-in Kotlin, so org.jetbrains.kotlin.android must not be applied.
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# The Compose compiler ships with Kotlin and must match its version.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
